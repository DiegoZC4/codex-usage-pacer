name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: codex-usage-pacer
          path: dist/*.zip
